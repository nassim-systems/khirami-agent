[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "khirami-agent"
version = "0.1.0"
description = "Deterministic framing and orchestration core for an AI business-consulting agent."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
classifiers = ["Private :: Do Not Upload"]
license-files = ["LICENSE"]
authors = [{ name = "nassim-systems" }]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=2.4,<3"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/khirami_agent/lexicons/*.py" = ["E501"]
